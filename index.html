
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futures Edge | Links</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      /* ปรับสีพื้นหลังให้เข้ากับโลโก้ */
      background: linear-gradient(160deg, #0b0e14 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #fff;
    }
    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    /* รูปโปรไฟล์ */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 24px; /* ทำให้เป็นสี่เหลี่ยมมุมมนตามโลโก้ */
      object-fit: cover;
      margin: 0 auto 20px;
      border: 2px solid rgba(0, 210, 163, 0.3); /* ขอบสีเขียวอ่อน */
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      background-color: #0b0e14;
    }
    .brand {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .bio {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .link-btn {
      display: block;
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    /* เพิ่มเอฟเฟกต์เวลาเอานิ้วจิ้ม (สำหรับมือถือ) */
    .link-btn:hover, .link-btn:active {
      background: rgba(0, 210, 163, 0.1);
      border-color: #00d2a3;
      transform: translateY(-2px);
    }
    .link-btn .sub {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- โลโก้และโปรไฟล์ -->
    <img src="logo.png" alt="Futures Edge Logo" class="avatar">
    <div class="brand">Futures Edge</div>
    <div class="bio">แพลตฟอร์มเครื่องมือและกลยุทธ์สำหรับการเทรด</div>

    <!-- ลิงก์ที่ 1: Gumroad (พร้อม UTM) -->
    <a class="link-btn"
       href="https://futuresedge1.gumroad.com/l/eooda?utm_source=tiktok&utm_medium=bio&utm_campaign=spring_launch&utm_content=product_1_gumroad&utm_term=trading"
       target="_blank" rel="noopener">
      สั่งซื้อผ่าน Gumroad
      <span class="sub">คลิกเพื่อดูรายละเอียดสินค้า</span>
    </a>

    <!-- ลิงก์ที่ 2: Payhip (พร้อม UTM) -->
    <a class="link-btn"
       href="https://payhip.com/b/lfgqt?utm_source=tiktok&utm_medium=bio&utm_campaign=spring_launch&utm_content=product_2_payhip&utm_term=trading"
       target="_blank" rel="noopener">
      สั่งซื้อผ่าน Payhip
      <span class="sub">ช่องทางสำรองสำหรับการชำระเงิน</span>
    </a>

    <div class="footer">© 2026 Futures Edge. All rights reserved.</div>
  </div>
</body>
</html>
